<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psynovia – Weiterleitung zur Buchung</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      color:#07335f;
      background:linear-gradient(180deg,#f8fdff,#eef8fd 55%,#f8fbff);
    }
    .card{
      width:min(100%,560px);
      padding:28px;
      border:1px solid rgba(126,179,205,.32);
      border-radius:24px;
      background:rgba(255,255,255,.94);
      box-shadow:0 18px 42px rgba(7,51,95,.095);
      text-align:center;
    }
    img{width:52px;height:52px;object-fit:contain}
    h1{margin:16px 0 10px;font-size:26px;line-height:1.15}
    p{margin:0;color:#365c78;line-height:1.55}
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      margin-top:20px;
      padding:0 20px;
      border-radius:16px;
      color:#fff;
      background:#07335f;
      font-weight:800;
      text-decoration:none;
    }
    .error{display:none}
  </style>
</head>
<body>
  <main class="card">
    <img src="/psynovia-logo.png" alt="Psynovia">
    <div id="progress">
      <h1>Ihre Buchung wird vorbereitet</h1>
      <p>Sie werden jetzt sicher zum Stripe-Checkout weitergeleitet.</p>
    </div>
    <div id="error" class="error">
      <h1>Weiterleitung nicht möglich</h1>
      <p>Die Fall-ID fehlt oder ist ungültig. Bitte starten Sie den Intake erneut oder schreiben Sie an info@psynovia.de.</p>
      <a href="/intake.html">Intake erneut öffnen</a>
    </div>
  </main>

  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const caseId = String(params.get("case_id") || "").trim();
      const validCaseId = /^(PSY|CHIEM)-\d{4}-[A-Z0-9]{6,12}$/.test(caseId);

      if(!validCaseId){
        document.getElementById("progress").style.display = "none";
        document.getElementById("error").style.display = "block";
        return;
      }

      const checkoutUrl =
        "https://book.stripe.com/5kQ3cufU6a532x0flS8N201?client_reference_id=" +
        encodeURIComponent(caseId);

      window.location.replace(checkoutUrl);
    })();
  </script>
</body>
</html>
